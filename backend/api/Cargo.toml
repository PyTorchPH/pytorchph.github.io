[package]
name = "pytorch-ph-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
base64 = "=0.22.1"
axum = { version = "=0.8.9", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
# Already in the tree through printpdf; decompresses the bundled school directory seed.
flate2 = "=1.1.10"
hex = "0.4"
hmac = "0.12"
printpdf = { version = "=0.12.8", default-features = false }
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"
