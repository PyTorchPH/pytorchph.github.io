[project]
name = "pytorch-ph-process-lab"
version = "0.1.0"
description = "Local-only Prefect and Playwright process verification for PyTorch PH."
requires-python = ">=3.11"
dependencies = [
  "prefect>=3.4,<4",
  "playwright>=1.45,<2",
  "questionary>=2.1,<3",
  "requests>=2.32,<3",
  "schemathesis>=4,<5",
]

[project.scripts]
pytorch-ph-process-lab = "process_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["process_lab"]
