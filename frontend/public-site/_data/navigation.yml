# Main menu. Every dropdown link must point at a page or an anchor that exists on that page.
main_menu:
  - title: "Community"
    key: "community"
    url: "/"
    has_dropdown: true
    dropdown_items:
      - title: "Upcoming programs"
        url: "/#events"
        url_type: "baseurl"
      - title: "Get involved"
        url: "/#get-involved"
        url_type: "baseurl"
      - title: "Code of Conduct"
        url: "/code-of-conduct/"
        url_type: "baseurl"

  - title: "News"
    key: "news"
    url: "/news/"
    has_dropdown: true
    dropdown_items:
      - title: "Community updates"
        url: "/news/#community-updates"
        url_type: "baseurl"
      - title: "PyTorch news"
        url: "/news/#pytorch-news"
        url_type: "baseurl"

  - title: "Learn"
    key: "learn"
    url: "/learn/"
    has_dropdown: true
    dropdown_items:
      - title: "Install PyTorch"
        url: "/get-started/locally/"
        url_type: "baseurl"
      - title: "Learning path"
        url: "/learn/#path"
        url_type: "baseurl"
      - title: "Sample code"
        url: "/learn/#sample-code"
        url_type: "baseurl"
      - title: "Open-source projects"
        url: "/learn/#projects"
        url_type: "baseurl"
      - title: "PyTorch docs"
        url: "https://docs.pytorch.org/docs/stable/"
        external: true

  - title: "Campus Labs"
    key: "campus-labs"
    url: "/campus-labs/"
    has_dropdown: false

  - title: "About"
    key: "about"
    url: "/about/"
    has_dropdown: true
    dropdown_items:
      - title: "About us"
        url: "/about/"
        url_type: "baseurl"
      - title: "Ambassadors"
        url: "/about/#ambassadors"
        url_type: "baseurl"
      - title: "Team"
        url: "/about/#team"
        url_type: "baseurl"

  - title: "Member Portal"
    key: "portal"
    url: "/portal/"
    url_type: "baseurl"
    has_dropdown: false
