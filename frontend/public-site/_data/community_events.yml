# The community events and training on the home page and in the event directory (/events/).
#
# `training`: one tile per training course. Nothing is written here: the courses, dates, and
# module names all come from the sessions officers publish in the portal (/portal/admin/website/) with
# this event type.
#
# `events`: the community event series, one tile each. The descriptions and dates below are from the
# organizers' planning document "PyTorch PH Events" (read 2026-11-14), in its own words where possible.
# Rules:
#   - Only what that document or the organizer states. A date the organizer has not confirmed is
#     `tentative`; one the document only proposes is month-only too. A series with no date has no
#     session here and shows no date.
#   - No venues until one is confirmed, no budgets, and no organizer names: every series is a
#     PyTorch Philippines program.
#   - A session published in the portal with the same `series` name replaces the sessions listed here
#     on the tiles.
#   - `slug` is the series' page in the directory (events/<slug>.html), and `page_session` the title of
#     the session that page is about: the page takes its name and date from it, and a tile links to the
#     page only while it shows that session with this file's date and status (the next edition has no
#     page until one is written, and a date published in the portal that differs from this file drops
#     the link until the two agree). When a date changes, change it here, and check the page's own
#     text (times, dates to remember) too.
#   - `cfp` is a call for proposals: the tile says when it opens, links to `url` while it is open (add
#     the Sessionize link when there is one; the series' page shows its button during the same
#     window), and says nothing once it has closed.
events:
  label: Community events
  # The tracks a proposal picks from, named as in Tensor Talks' Sessionize call for proposals. ML &
  # Coffee uses the same ones (the organizer, 2026-11-14). Each has a definition, in the form of the
  # "Suggested Topics" on the Linux Foundation's PyTorch Day China call for proposals (read 2026-11-14):
  #   - Training and Post-Training, Inference and Deployment: that page's definitions of its tracks of
  #     the same names, in its words.
  #   - PyTorch Ecosystem: that page's definition, with the projects the Sessionize call names.
  #   - Math and Foundations, Agents and Applications: that page has no such tracks. These two
  #     definitions were drafted for this site from the series' own description ("the mathematics
  #     underneath, and agentic systems") and are the organizer's to correct.
  tracks:
    - name: "Training and Post-Training"
      description: "Model training, fine-tuning, and alignment using PyTorch and related open-source stacks. Topics include distributed training, supervised fine-tuning (SFT), reinforcement learning, preference optimization, and improvements in training efficiency, stability, and resource utilization."
    - name: "Inference and Deployment"
      description: "Deploying models as reliable, continuously running services. Topics include LLM and multimodal inference, quantization, speculative decoding, KV cache optimization, cluster scheduling, and trade-offs among latency, throughput, and cost across cloud, on-premises, and local deployments."
    - name: "Math and Foundations"
      description: "The mathematics underneath modern AI systems. Topics include optimization and automatic differentiation, the linear algebra and probability that models rely on, and how architectures such as attention work."
    - name: "Agents and Applications"
      description: "Agentic systems and applications built on models. Topics include tool use, planning and memory, retrieval, evaluating agents, and case studies from real use."
    - name: "PyTorch Ecosystem"
      description: "Tools and community contributions built on PyTorch and related open-source projects: vLLM, DeepSpeed, Ray, Helion, Safetensors and others. Topics include domain-specific libraries, development and evaluation tools, and open-source collaboration."
  series:
    - name: Tensor Talks
      slug: tensor-talks
      page_session: "Tensor Talks: Initialized"
      kind: Talks
      blurb: "Technical talks on how modern AI systems are built: training, inference, the mathematics underneath, and agentic systems."
      cfp:
        opens: "2026-11-18"
        closes: "2026-12-06"
        url: ""
      # Registration is on Luma: a private (unlisted) event whose own registration the organizer opens
      # by hand. The series' page shows "Registration not yet open" before `opens`, a Register button
      # to `url` from `opens` through `closes`, and "Registration closed" after. Open the Luma
      # registration on the opening day, or the button leads to a page that says it is closed.
      registration:
        opens: "2026-12-21"
        closes: "2027-01-18"
        url: "https://luma.com/b6k2ve9l"
      sessions:
        # Saturday, January 23, 2027, tentative: the organizer, 2026-11-14 (it replaces the document's
        # and the Sessionize page's January 16). The dates that follow from the event's day
        # (registration closing, slides due) moved a week with it on the event's page.
        - title: "Tensor Talks: Initialized"
          startsAt: "2027-01-23"
          dateStatus: tentative
        # "Sat, Mar 13, 2027 (proposed)" in the document.
        - title: "Tensor Talks #2"
          startsAt: "2027-03"
          dateStatus: tentative

    - name: ML & Coffee
      slug: ml-and-coffee
      page_session: "ML & Coffee"
      kind: Meetup
      blurb: "Short talks and a networking session for people interested in machine learning."
      sessions:
        # February 20, 2027, tentative: given by the organizer on 2026-11-14 (it replaces the document's
        # "February 2027 (tab lists Thu, Feb 4)").
        - title: "ML & Coffee"
          startsAt: "2027-02-20"
          dateStatus: tentative

    - name: Torch Trials
      slug: torch-trials
      page_session: "Torch Trials"
      kind: Hackathon
      blurb: "A hackathon where teams run experiments, benchmark results, and present their findings."
      sessions:
        # March 20, 2027: given by the organizer on 2026-11-14 (the document has no date). Shown as
        # tentative until the organizer confirms it.
        - title: "Torch Trials"
          startsAt: "2027-03-20"
          dateStatus: tentative

training:
  label: Training
  event_type: training
