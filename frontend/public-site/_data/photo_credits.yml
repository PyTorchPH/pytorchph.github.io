# Photos used on the site that were not made by PyTorch Philippines, with what their licenses ask
# for. Every page that shows one credits it in its footer (_includes/footer.html), and
# `npm run test:hero-photo:built` checks that.
#
# The home page hero crossfades these photos in the order of `hero_photos:` in index.html's front
# matter (see _includes/ph/hero.html and assets/hero-slides.js).
#
# The two Manila photos were checked on 2026-11-10 and the Lapulapu Monument and Mount Apo photos on
# 2026-11-14, at their pages on Wikimedia Commons: author, license, and the copyright status of the place shown. The
# Philippines has no freedom of panorama, so a recent building or monument can still be under
# copyright: the Rizal Monument and Fort Santiago are clear, and Mount Apo is a natural landmark; the Lapulapu
# Monument is not (see its `status`). `sha1` is the original file's SHA-1 as its source reports it;
# our downloads matched it.
#
# Our copies in assets/images/hero/ are cropped (a 2:1 `image` for wide screens and a 3:4
# `image_portrait` for phones), resized, converted to black and white, and carry no metadata.
# Adaptations of CC BY-SA photos are shared under CC BY-SA 4.0 as well.
#
# Fields: title, author, author_url, attribution (how the author asks to be credited, if they say),
# source_url, license, license_url, changes, architect (credited in the footer when the building's
# design is still under copyright), status (copyright status of the place shown, for maintainers),
# sha1, image, image_portrait, position (vertical background position on wide screens),
# position_wide (on screens 1800 px and wider, where the photo is scaled up most).

rizal_monument:
  title: "DSC 0733 Rizal Monument"
  author: GRMondala
  author_url: "https://commons.wikimedia.org/wiki/User:GRMondala"
  source_url: "https://commons.wikimedia.org/wiki/File:DSC_0733_Rizal_Monument.jpg"
  license: CC BY-SA 4.0
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  changes: "cropped, resized, and converted to black and white"
  status: "Taken 2018-09-29 in Rizal Park for Wiki Loves Monuments 2018. The monument (Richard Kissling, died 1919) is tagged {{PD-Philippines-FoP work}} on Commons."
  sha1: 24e1c3f4aba30bc4039bc53a7aefcb8766926e00
  image: /assets/images/hero/rizal-monument-night.jpg
  image_portrait: /assets/images/hero/rizal-monument-night-portrait.jpg
  position: "40%"
  position_wide: "30%"

fort_santiago:
  title: "Manila, Fort Santiago, Walled city of Intramuros, Philippines"
  author: Vyacheslav Argenberg
  author_url: "https://commons.wikimedia.org/wiki/User:Argenberg"
  attribution: "© Vyacheslav Argenberg"
  source_url: "https://commons.wikimedia.org/wiki/File:Manila,_Fort_Santiago,_Walled_city_of_Intramuros,_Philippines.jpg"
  license: CC BY 4.0
  license_url: "https://creativecommons.org/licenses/by/4.0/"
  changes: "cropped, resized, and converted to black and white"
  status: "Taken 2009-01-22. The Fort Santiago gate is in Commons' category 'Built in Manila in 1714'."
  sha1: a53596beb9166a418336ee67f58f3f32e89f9c2d
  image: /assets/images/hero/fort-santiago-gate.jpg
  image_portrait: /assets/images/hero/fort-santiago-gate-portrait.jpg
  position: "45%"
  position_wide: "40%"

lapulapu_monument:
  title: "LAPU LAPU MONUMENT"
  author: Claudio monceda
  author_url: "https://commons.wikimedia.org/wiki/User:Claudio_monceda"
  source_url: "https://commons.wikimedia.org/wiki/File:LAPU_LAPU_MONUMENT.jpg"
  license: CC BY-SA 4.0
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  changes: "cropped, resized, and converted to black and white"
  status: "Taken 2026-10-29 at Mactan Shrine (Liberty Shrine), Lapu-Lapu City, Cebu, for Wiki Loves Monuments. The photo is freely licensed, but the bronze Lapulapu statue it shows was erected in 1981 (English Wikipedia, 'Mactan Shrine') and Commons files it under NoFoP-Philippines: the statue's design is most likely still under copyright, and its sculptor was not identified in the sources read. Used at the site owner's request (2026-11-14), who was told of this; replace it if the rights holder objects. The 1866 Magellan marker behind it is in the public domain."
  sha1: eb8708664a7e3054f0c261680d85c6cb63ff7734
  image: /assets/images/hero/lapulapu-monument.jpg
  image_portrait: /assets/images/hero/lapulapu-monument-portrait.jpg
  # Framed from the top, so the statue's head shows under the header.
  position: "0%"
  position_wide: "0%"

mount_apo:
  title: "Mount apo"
  author: Robert Anton Pimentel Aparente
  author_url: "https://commons.wikimedia.org/wiki/User:AntonNawalangMalay"
  source_url: "https://commons.wikimedia.org/wiki/File:Mount_apo.jpg"
  license: CC BY-SA 4.0
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
  changes: "cropped, resized, and converted to black and white"
  status: "Taken 2012-04-07: Mount Apo, the country's highest peak, on the boundary of Davao City, Davao del Sur and Cotabato, at dawn with mist at its foot. A natural landmark: no copyright in the subject. Uploaded as the author's own work."
  sha1: 27f2e645ce0695345f896a719e54f25120d1ff82
  image: /assets/images/hero/mount-apo.jpg
  image_portrait: /assets/images/hero/mount-apo-portrait.jpg
  # Framed from the bottom, so the peak and the mist at its foot sit just above the hero's waves.
  position: "100%"
  position_wide: "100%"

