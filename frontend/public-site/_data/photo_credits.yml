# Photos used on the site that were not made by PyTorch Philippines, with what their licenses ask
# for. Every page that shows one credits it in its footer (_includes/footer.html), and
# `npm run test:hero-photo:built` checks that.
#
# The home page hero crossfades these photos in the order of `hero_photos:` in index.html's front
# matter (see _includes/ph/hero.html and assets/hero-slides.js).
#
# All four were checked on Wikimedia Commons on 2026-11-10: author, license, and the copyright
# status of the place shown (the Philippines has no freedom of panorama, so a recent building or
# monument could still be under copyright; none of these is). `sha1` is the original file's SHA-1
# as Commons reports it; our downloads matched it.
#
# Our copies in assets/images/hero/ are cropped (a 2:1 `image` for wide screens and a 3:4
# `image_portrait` for phones), resized, converted to black and white, and carry no metadata.
# Adaptations of CC BY-SA photos are shared under CC BY-SA 4.0 as well.
#
# Fields: title, author, author_url, attribution (how the author asks to be credited, if they say),
# source_url, license, license_url, changes, architect (credited in the footer when the building's
# design is still under copyright), status (copyright status of the place shown, for maintainers), sha1, image, image_portrait, position (vertical background position on wide
# screens), position_wide (on screens 1800 px and wider, where the photo is scaled up most).

malacanang:
  title: "Facade of the Malacañang Palace as seen from Pasig River"
  author: Official Gazette of the Philippines
  author_url: "https://en.wikipedia.org/wiki/Official_Gazette_(Philippines)"
  source_url: "https://en.wikipedia.org/wiki/File:Malaca%C3%B1ang_Palace_(local_img).jpg"
  license: Public domain
  license_url: "https://commons.wikimedia.org/wiki/Template:PD-PhilippinesGov"
  changes: "cropped, resized, and converted to black and white"
  architect: Jorge Ramos
  status: >-
    Taken 2016-05-26 by the Official Gazette of the Philippines. The photo is a Philippine
    government work, so no copyright subsists in it (RA 8293 sec. 176; the Official Gazette:
    "All content is in the public domain unless otherwise stated"). The building is not: the palace
    as it stands is the 1979 reconstruction overseen by architect Jorge Ramos (died 2015), whose
    design is presumed under copyright until 2065, and the Philippines has no freedom of panorama.
    For that reason Wikimedia Commons deleted this photo (2021) and English Wikipedia hosts it only
    as {{FoP-USonly}}. Used here at the site owner's decision on 2026-11-10, accepting that risk.
    Replace it with a photo used with the Office of the President's permission if one is obtained.
  sha1: b0ec78b8392ae359db8cd0ec5ad69d762af88406
  image: /assets/images/hero/malacanang-palace-river.jpg
  image_portrait: /assets/images/hero/malacanang-palace-river-portrait.jpg
  position: "85%"
  position_wide: "70%"

