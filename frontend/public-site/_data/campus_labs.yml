# Campus Labs leads, exactly as PyTorch Philippines' own announcement posters give them. The posters
# are the only source: do not add titles, cities, links, or people that are not on a poster.
#
# Posters (provided by the PyTorch Foundation Ambassador for the Philippines, 2026-11-10):
#   - One poster per lead, "PyTorch Philippines Campus Labs", Batch 1 (10) and Batch 2 (16): a name
#     and a university.
#   - "National University Manila becomes the first-ever PyTorch Philippines Campus Labs recognized
#     student organization", headed by Renz Jeric Viloria, "PyTorch Philippines Campus Labs Lead".
#     This is the only poster that gives a title, so only Renz has `role`; everyone else is shown as
#     "Campus Labs" with their batch. His own poster spells his name "Renz Jerik Viloria", which is
#     used here.
#
# Rules for entries:
#   - `university` and `name` are the poster text. Only spacing around hyphens is made consistent
#     ("University- Manila" becomes "University - Manila").
#   - `island` is the island group of the university named on the poster (needed to group the list).
#   - `aliases` are other names officers might use for the same university in the portal; they are
#     used for matching only and never shown. Quote an alias that contains a comma.
#   - `photo` is the portrait cropped from the person's own poster (straightened and cropped to the
#     face, 240 × 240, no metadata), used at the ambassador's direction. No contact details.
#
# Entries give way to chapters officers publish in the portal (/portal/admin/website/) for the same
# university.
