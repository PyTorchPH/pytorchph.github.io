# Campus Labs universities and their leads, from public sources only. Each entry records where it was
# verified; `sources` is for maintainers and is not shown on the site. Do not add an entry without a
# public source, and re-check the sources before editing. People are listed by name and role only
# (no photos or contact details).
#
# These entries are the public record until officers publish chapters in the officer portal
# (/portal/admin/website/). A chapter published there for the same university replaces the entry here
# on the Campus Labs page (matched on the `university` name, ignoring case).
#
# Source keys:
#   chapter-page   the chapter's own public page (first-party)
#   lead-profile   the lead's own public profile states the role (first-party)
