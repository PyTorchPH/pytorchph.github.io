# Campus Labs leads and their universities, from public sources only. Each entry records where it
# was verified; `sources` is for maintainers and is not shown on the site. Do not add an entry
# without a public source, and re-check the sources before editing.
#
# Rules for entries:
#   - `role` quotes the title used in the source. Do not normalize titles.
#   - `city` appears only when the source names the campus.
#   - `chapter` and `url` appear only when the chapter has its own public page.
#   - People are listed by name and role only (no photos or contact details).
#   - `aliases` are other names officers might use for the same university in the portal.
#
# This list is not complete: PyTorch Philippines has announced more Campus Labs leads than have a
# public source here. Entries give way to chapters officers publish in the portal
# (/portal/admin/website/) for the same university.
#
# Source keys:
#   chapter-page   the chapter's own public page (first-party)
#   lead-profile   the lead's own public profile or site
#   fireside-2026  PyTorch Philippines' announcement of its fireside chat with "PyTorch Campus Labs
#                  Leads" (2026), read through a search index because LinkedIn requires sign-in:
#                  https://www.linkedin.com/posts/pytorch-philippines_pytorchphilippines-pytorchph-pytorchcampuslabs-activity-7468199885024964609-YHpX
#                  Confirm spellings with the people named.
