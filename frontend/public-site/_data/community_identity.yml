tagline: "Let's CONNECT, LEARN, BUILD, GROW."
description: >-
  A nationwide, community-driven network connecting researchers, universities,
  students, industry and government professionals, startups, and developers
  across Luzon, Visayas, and Mindanao to learn, collaborate, innovate, and build
  with PyTorch®.
# Mission and principles are the organization's own statements (github.com/PyTorchPH profile).
mission: >-
  Make practical machine learning education and collaboration more accessible throughout the
  Philippines.
principles:
  - Openness
  - Integrity
  - Inclusion
  - Collaboration
  - Continuous Learning
  - Responsible Innovation
# The About page narrative, short on purpose: three reasons (a heading and one or two sentences each)
# and three goals (one sentence each). Keep statements verifiable: no statistics without a cited source.
reasons:
  - heading: Open tools for everyone
    text: >-
      PyTorch's code, documentation, and tutorials are open, so a student in Davao can learn from and
      build on the same tools that research labs and companies use.
  - heading: Contributors, not only users
    text: >-
      Filipino students, researchers, and engineers can work on problems that matter here, in our
      languages, industries, and communities.
  - heading: One community, three island groups
    text: >-
      Learning alone is hard. A community across Luzon, Visayas, and Mindanao puts study programs,
      mentors, and collaborators within reach.
goals:
  - Members who move from their first tensor to models they can explain, deploy, and share.
  - Campus Labs active in all three island groups.
  - More Filipino contributions to PyTorch and its ecosystem.
