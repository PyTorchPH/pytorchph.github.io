<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico?">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% include open_graph_and_meta.html %}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/main.css?v={{ site.time | date: '%s' }}">
  <script src="{{ site.baseurl }}/assets/vendor/jquery.min.js"></script>
  <script src="{{ site.baseurl }}/assets/vendor/popper.min.js"></script>
  <script src="{{ site.baseurl }}/assets/vendor/bootstrap.min.js"></script>
  <script src="{{ site.baseurl }}/assets/vendor/anchor.min.js"></script>
  {%- if page.header_over_hero %}
  {%- comment -%} assets/header-over-hero.js tints the header over the hero; without it, keep it solid. {%- endcomment -%}
  <noscript><style>.ph-header-over-hero .header-holder.ph-header { background-color: #262626; }</style></noscript>
  {%- endif %}
</head>
