# Resource budget for the API ("the bouncer" at the OS level). Installed as
# /etc/systemd/system/pytorch-ph-api.service.d/resources.conf. Percentages are of physical RAM;
# lower them when another service on this host needs room, then:
#   sudo systemctl daemon-reload && sudo systemctl restart pytorch-ph-api
[Service]
MemoryAccounting=yes
# Above this the kernel reclaims and swaps the API's memory instead of letting it grow.
MemoryHigh=50%
# Hard ceiling; the rest of RAM stays for the OS, Caddy and other services.
MemoryMax=90%
# The API may use the swapfile for overflow rather than being killed.
MemorySwapMax=infinity
# Relative shares (default 100): the API wins CPU and disk over updates and agents when busy.
CPUWeight=200
IOWeight=200
